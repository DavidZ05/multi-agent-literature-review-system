name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile source tree
        run: python -m compileall -q src tests

      - name: Build installable wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Smoke test installed commands
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip check
          literature-review --help
          literature-review plugins
          literature-review-workbench --help
          literature-review --db .ci/workflow.db --artifacts .ci/artifacts doctor

  browser-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install application and browser test dependencies
        run: |
          python -m pip install -e .
          python -m pip install -r requirements-docs.txt
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Chromium end-to-end tests
        run: |
          npm run test:browser
          mkdocs build --strict
          npm run test:docs:browser

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: output/playwright/
          if-no-files-found: ignore
