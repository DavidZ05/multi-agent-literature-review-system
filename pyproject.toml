[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-literature-review-system"
version = "0.8.1"
description = "A durable multi-agent workflow for evidence-grounded literature reviews."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024.2.2",
  "pdfplumber>=0.11,<1",
]

[project.scripts]
literature-review = "src.literature_review.cli:main"
literature-review-workbench = "src.literature_review.cli:workbench_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.setuptools.package-data]
"src.literature_review" = [
  "resources/*.json",
  "prompts/*.txt",
  "workbench/static/*.html",
  "workbench/static/*.css",
  "workbench/static/*.js",
]
